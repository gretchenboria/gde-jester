<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Royal GDE Jester</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #09090b; --panel: rgba(20, 20, 24, 0.78); --line: rgba(255, 255, 255, 0.08);
        --text: #fafafa; --muted: #a1a1aa; --red: #ef4444; --amber: #f59e0b; --green: #10b981; --blue: #3b82f6;
        --side-w: min(420px, 38vw);
    }
    * { box-sizing: border-box; }
    body, html { margin: 0; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; color: var(--text);
        background: radial-gradient(ellipse at 35% 40%, #1c1626 0%, var(--bg) 70%); }
    button { font-family: inherit; }
    #stage { position: fixed; inset: 0; }

    #topbar { position: fixed; top: 14px; left: 16px; right: calc(var(--side-w) + 32px); display: flex; align-items: center; gap: 10px; z-index: 5; pointer-events: none; }
    #topbar h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.2px; }
    #state { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; padding: 4px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
    #state[data-s="listening"] { color: var(--red); border-color: rgba(239,68,68,.4); }
    #state[data-s="thinking"] { color: var(--amber); border-color: rgba(245,158,11,.4); }
    #state[data-s="talking"] { color: var(--green); border-color: rgba(16,185,129,.4); }
    #log-toggle { margin-left: auto; pointer-events: auto; background: var(--panel); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 11px; cursor: pointer; }

    #side { position: fixed; top: 14px; right: 16px; bottom: 16px; width: var(--side-w); display: flex; flex-direction: column; gap: 10px; z-index: 5; }
    .card { background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 18px; }

    #juggle { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; }
    #juggle:empty { display: none; }
    .chip { flex: 0 1 auto; max-width: calc(50% - 3px); min-width: 0; display: flex; align-items: center; gap: 7px; font: inherit; font-size: 12px; color: var(--text); padding: 6px 10px; border-radius: 10px; background: rgba(255,255,255,.05); border: 1px solid var(--line); cursor: pointer; white-space: nowrap; }
    .chip span.t { overflow: hidden; text-overflow: ellipsis; }
    .chip i { flex: none; width: 10px; height: 10px; border-radius: 50%; }
    .chip b { font-weight: 600; color: var(--muted); }
    .chip.hot b { color: var(--red); } .chip.warm b { color: var(--amber); }
    .chip.sel { border-color: rgba(255,255,255,.5); background: rgba(255,255,255,.12); }

    #detail { position: relative; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; max-height: 46vh; overflow-y: auto; }
    #detail[hidden] { display: none; }
    #detail .kind { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
    #detail h2 { margin: 0; font-size: 17px; font-weight: 600; padding-right: 28px; }
    #detail .when { font-size: 13px; color: var(--muted); }
    #detail .when b { color: var(--text); font-weight: 500; }
    #detail p { margin: 0; font-size: 14px; line-height: 1.5; color: #e4e4e7; }
    #detail .summary { white-space: pre-line; }
    #detail .source { font-size: 12px; color: #71717a; }
    #detail .links a { display: block; font-size: 12px; color: #93c5fd; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #detail .close { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; }
    #detail .ask { align-self: flex-start; font-size: 12px; font-weight: 500; padding: 7px 12px; border-radius: 10px; cursor: pointer; border: 1px solid rgba(59,130,246,.5); background: rgba(59,130,246,.15); color: #dbeafe; }
    #detail .actions { margin-top: 0; }

    #tip { position: fixed; z-index: 8; pointer-events: none; font-size: 12px; padding: 5px 9px; border-radius: 8px; background: rgba(0,0,0,.8); border: 1px solid var(--line); display: none; white-space: nowrap; transform: translate(12px, -28px); }
    #board-status { font-size: 12px; color: #71717a; }

    #vision { margin: 0; position: relative; overflow: hidden; aspect-ratio: 1 / 1; max-height: 36vh; align-self: center; width: 100%; display: none; cursor: zoom-in; }
    #vision.on { display: block; }
    #vision img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .6s ease; }
    #vision img.ready { opacity: 1; }
    #vision figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 12px 10px; font-size: 11px; color: #e4e4e7; background: linear-gradient(transparent, rgba(0,0,0,.75)); }
    #vision .shimmer { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 12px; color: var(--muted);
        background: linear-gradient(110deg, rgba(255,255,255,.02) 30%, rgba(255,255,255,.08) 50%, rgba(255,255,255,.02) 70%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
    #vision.painting .shimmer { display: flex; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    #chat { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
    .msg { max-width: 92%; font-size: 14px; line-height: 1.5; padding: 10px 13px; border-radius: 14px; }
    .msg.user { align-self: flex-end; background: rgba(59,130,246,.18); border: 1px solid rgba(59,130,246,.3); }
    .msg.user.pending { color: var(--muted); font-style: italic; }
    .msg.jester { align-self: flex-start; background: rgba(255,255,255,.04); border: 1px solid var(--line); color: #e4e4e7; }
    .msg.error { border-color: rgba(245,158,11,.4); color: var(--amber); }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .act { font-size: 12px; font-weight: 500; padding: 7px 11px; border-radius: 10px; cursor: pointer; border: 1px solid rgba(16,185,129,.45); background: rgba(16,185,129,.12); color: #d1fae5; text-decoration: none; }
    .act:hover { background: rgba(16,185,129,.22); }
    .act:disabled { opacity: .6; cursor: wait; }
    .act.done { border-color: rgba(16,185,129,.8); background: rgba(16,185,129,.25); }
    .act.fail { border-color: rgba(245,158,11,.6); background: rgba(245,158,11,.12); color: #fde68a; }
    #suggest { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 12px; }
    #suggest button { font-size: 12px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--muted); cursor: pointer; }
    #suggest button:hover { color: var(--text); }
    .chatcard { flex: 1; min-height: 0; display: flex; flex-direction: column; }

    #dock { position: fixed; left: 16px; right: calc(var(--side-w) + 32px); bottom: 16px; display: flex; align-items: center; gap: 10px; z-index: 6; max-width: 640px; margin: 0 auto; padding: 8px; }
    #mic { position: relative; flex: none; width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer; color: #fff; background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 4px 14px rgba(239,68,68,.35); display: grid; place-items: center; }
    #mic::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid rgba(239,68,68,.6); transform: scale(var(--lvl, 1)); opacity: 0; transition: opacity .2s; }
    #mic.rec { background: linear-gradient(135deg, #7f1d1d, #450a0a); }
    #mic.rec::after { opacity: 1; }
    #mic:disabled { opacity: .5; cursor: wait; }
    #mic svg, #send svg { width: 22px; height: 22px; }
    #text { flex: 1; min-width: 0; font: inherit; font-size: 15px; color: var(--text); background: transparent; border: none; outline: none; padding: 10px 6px; }
    #text::placeholder { color: #71717a; }
    #send { flex: none; width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer; background: var(--blue); color: #fff; display: grid; place-items: center; }
    #send:disabled { opacity: .4; cursor: default; }

    #log { position: fixed; top: 52px; left: 16px; width: min(420px, 50vw); max-height: 40vh; overflow-y: auto; z-index: 7; padding: 10px; display: none; flex-direction: column; gap: 6px; }
    #log.open { display: flex; }
    .log-entry { font: 11px 'Courier New', monospace; color: #e4e4e7; border-left: 3px solid var(--blue); padding: 6px 9px; background: rgba(0,0,0,.25); border-radius: 4px; word-break: break-word; }
    .log-entry.ok { border-left-color: var(--green); color: #a7f3d0; }
    .log-entry.error { border-left-color: var(--amber); color: #fde68a; }

    #lightbox { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; cursor: zoom-out; padding: 16px; }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 100%; max-height: 100%; border-radius: 12px; }

    @media (max-width: 820px) {
        :root { --side-w: calc(100vw - 24px); }
        #topbar { right: 12px; left: 12px; }
        #side { top: 47vh; left: 12px; right: 12px; bottom: 84px; width: auto; }
        #detail { max-height: 30vh; }
        #vision { position: fixed; top: 50px; left: 12px; width: 30vw; max-width: 160px; z-index: 6; }
        #vision figcaption { display: none; }
        #dock { left: 12px; right: 12px; bottom: 12px; max-width: none; }
        #log { width: calc(100vw - 24px); left: 12px; }
    }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<div id="stage"></div>

<header id="topbar">
    <h1>The Royal GDE Jester</h1>
    <span id="state" data-s="idle">idle</span>
    <span id="board-status"></span>
    <button id="log-toggle">Court log</button>
</header>
<div id="log" class="card"></div>

<aside id="side">
    <div id="juggle" class="card"></div>
    <section id="detail" class="card" hidden>
        <button class="close" title="Put it back">&times;</button>
        <div class="kind"></div>
        <h2></h2>
        <div class="when"></div>
        <p class="summary"></p>
        <div class="source"></div>
        <div class="links"></div>
        <div class="actions"></div>
        <button class="ask">Ask her about this</button>
    </section>
    <figure id="vision" class="card">
        <img alt="">
        <div class="shimmer">Spicy-Mayo is painting...</div>
        <figcaption></figcaption>
    </figure>
    <div class="card chatcard">
        <div id="chat">
            <div class="msg jester">Heya, boss! Every ball I'm juggling is a piece of your GDE work. Tap one to take a peek, or ask me anything. I remember everything. Well, mostly.</div>
        </div>
        <div id="suggest">
            <button>What's due this week?</button>
            <button>Book prep for my next talk</button>
            <button>Any EAP notebooks to grab?</button>
        </div>
    </div>
</aside>

<div id="dock" class="card">
    <button id="mic" title="Tap to talk, tap again to send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <input id="text" placeholder="Ask me anything, or tap the mic (hold Space)" autocomplete="off">
    <button id="send" disabled title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
</div>

<div id="tip"></div>
<div id="lightbox"><img alt=""></div>

<script>
// ---------------------------------------------------------------- scene
const stage = document.getElementById('stage');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.appendChild(renderer.domElement);

// Metallic PBR materials look flat without something to reflect
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
scene.add(new THREE.AmbientLight(0xffffff, 0.3));
const spot = new THREE.SpotLight(0xffca28, 2, 0, Math.PI / 5, 0.6);
spot.position.set(0, 12, 8);
scene.add(spot);
const key = new THREE.DirectionalLight(0xffffff, 1.3);
key.position.set(5, 6, 6);
scene.add(key);
const rim = new THREE.DirectionalLight(0x8b5cf6, 1.2);
rim.position.set(-6, 4, -6);
scene.add(rim);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enableZoom = false;
controls.enablePan = false;
controls.minPolarAngle = Math.PI * 0.38;
controls.maxPolarAngle = Math.PI * 0.55;
controls.minAzimuthAngle = -0.9;
controls.maxAzimuthAngle = 0.9;

// Everything below is in "jester units": he is H tall, feet at y = 0, facing +z.
const H = 4;
const UP = new THREE.Vector3(0, 1, 0);
const FWD = new THREE.Vector3(0, 0, 1);
const SIDE = new THREE.Vector3(1, 0, 0);   // flipped at load so it points from his right hand to his left

// Framing. The jester gets the open part of the screen (left on desktop, top
// on phones) and the camera is fitted to his juggling space, not the window.
function layout() {
    const W = innerWidth, Ht = innerHeight, mobile = W <= 820;
    const sideW = mobile ? 0 : Math.min(420, W * 0.38) + 32;
    const area = mobile ? { x: 0, y: 44, w: W, h: Ht * 0.47 - 44 } : { x: 0, y: 50, w: W - sideW, h: Ht - 50 - 90 };
    const bottom = H * 0.3, top = H * 1.2, cy = (bottom + top) / 2;
    const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const distH = ((top - bottom) / 2) / tanHalf * (Ht / area.h);
    const distW = (H * 0.42) / (tanHalf * (W / Ht)) * (W / area.w);
    const dist = Math.max(distH, distW);
    camera.aspect = W / Ht;
    camera.position.set(0, cy, dist);
    controls.target.set(0, cy, 0);
    camera.setViewOffset(W, Ht, W / 2 - (area.x + area.w / 2), Ht / 2 - (area.y + area.h / 2), W, Ht);
    camera.updateProjectionMatrix();
    renderer.setSize(W, Ht);
    controls.update();
}
addEventListener('resize', layout);
layout();

// ---------------------------------------------------------------- jester
let model = null, mixer = null;
const B = {};                       // named bones
const rest = new Map();             // bone -> rest local quaternion
let ready = false;

function findBone(re) {
    let hit = null;
    model.traverse(o => { if (!hit && o.isBone && re.test(o.name)) hit = o; });
    return hit;
}

new THREE.GLTFLoader().load('/static/jester.glb', gltf => {
    model = gltf.scene;
    const maxAniso = renderer.capabilities.getMaxAnisotropy();
    model.traverse(o => {
        if (!o.isMesh) return;
        // The Sketchfab scene ships its display floor; it reads as a gray smudge.
        if (/^Plane001/.test(o.name) || /^Plane001/.test(o.parent && o.parent.name)) { o.visible = false; return; }
        o.frustumCulled = false;   // skinned bounds don't follow IK'd arms
        // The Sketchfab export marks the solid body alphaMode BLEND.
        // Blended materials skip the depth buffer, so his back faces
        // painted through his front in patches: the moth-eaten look.
        // Opaque + an alpha cutout keeps any real holes in the texture.
        if (o.material.transparent) {
            o.material.transparent = false;
            o.material.depthWrite = true;
            o.material.alphaTest = 0.5;
            o.material.needsUpdate = true;
        }
        ['map', 'normalMap', 'metalnessMap', 'roughnessMap'].forEach(k => {
            if (o.material[k]) o.material[k].anisotropy = maxAniso;
        });
    });

    // Normalize: H tall, feet on the floor, centered.
    let box = new THREE.Box3().setFromObject(model);
    const s = H / (box.max.y - box.min.y);
    model.scale.multiplyScalar(s);
    box = new THREE.Box3().setFromObject(model);
    const c = box.getCenter(new THREE.Vector3());
    model.position.sub(new THREE.Vector3(c.x, box.min.y, c.z));
    scene.add(model);

    // Biped names come through as "Bip001_L_Hand_011" etc.
    const sides = { L: 'L', R: 'R' };
    for (const k in sides) {
        B['upper' + k] = findBone(new RegExp(`Bip001_${k}_UpperArm`));
        B['fore' + k] = findBone(new RegExp(`Bip001_${k}_Forearm`));
        B['hand' + k] = findBone(new RegExp(`Bip001_${k}_Hand`));
        B['finger' + k] = findBone(new RegExp(`Bip001_${k}_Finger2_\\d+$`));
        B['thumb' + k] = findBone(new RegExp(`Bip001_${k}_Finger0_\\d+$`));
        B['foot' + k] = findBone(new RegExp(`Bip001_${k}_Foot`));
        B['toe' + k] = findBone(new RegExp(`Bip001_${k}_Toe0_\\d+$`));
    }
    B.head = findBone(/Bip001_Head_\d+$/);
    B.neck = findBone(/Bip001_Neck_\d+$/);
    B.spine = findBone(/Bip001_Spine_\d+$/);
    B.spine1 = findBone(/Bip001_Spine1_\d+$/);
    B.spine2 = findBone(/Bip001_Spine2_\d+$/);
    const missing = Object.keys(B).filter(k => !B[k]);
    if (missing.length) console.warn('Missing bones', missing);
    Object.values(B).forEach(b => b && rest.set(b, b.quaternion.clone()));

    if (gltf.animations.length) {
        mixer = new THREE.AnimationMixer(model);
        gltf.animations.forEach(clip => mixer.clipAction(clip).play());
        mixer.update(0);
    }
    model.updateMatrixWorld(true);

    // Face the camera: toes point forward.
    const toe = B.toeL.getWorldPosition(new THREE.Vector3()).sub(B.footL.getWorldPosition(new THREE.Vector3()));
    if (toe.z < 0) { model.rotation.y += Math.PI; model.updateMatrixWorld(true); }
    const l = B.upperL.getWorldPosition(new THREE.Vector3()), r = B.upperR.getWorldPosition(new THREE.Vector3());
    SIDE.copy(l.sub(r).setY(0).normalize());

    ready = true;
    log('Jester loaded: ' + Object.keys(B).length + ' bones rigged.', 'ok');
}, undefined, e => log('Model failed to load: ' + e.message, 'error'));

// ---- bone helpers. All rotations are world space, so they don't care how
// 3ds Max oriented each Biped bone's local axes.
const _q1 = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _q3 = new THREE.Quaternion();
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3(), _v4 = new THREE.Vector3();

function rotateWorld(bone, qWorld) {
    bone.getWorldQuaternion(_q1);
    bone.parent.getWorldQuaternion(_q2);
    _q3.copy(qWorld).multiply(_q1);
    bone.quaternion.copy(_q2.invert().multiply(_q3));
    bone.updateMatrixWorld(true);
}
function turn(bone, axis, angle) {
    if (bone && angle) rotateWorld(bone, new THREE.Quaternion().setFromAxisAngle(axis, angle));
}
function aim(bone, childPos, target) {
    const p = bone.getWorldPosition(new THREE.Vector3());
    const from = childPos.clone().sub(p).normalize(), to = target.clone().sub(p).normalize();
    rotateWorld(bone, new THREE.Quaternion().setFromUnitVectors(from, to));
}
const wp = b => b.getWorldPosition(new THREE.Vector3());

// Analytic two-bone IK: put the wrist on target, elbow bent toward pole.
function reach(upper, fore, hand, target, pole) {
    const S = wp(upper), E = wp(fore), W = wp(hand);
    const a = S.distanceTo(E), b = E.distanceTo(W);
    const dir = target.clone().sub(S);
    const d = THREE.MathUtils.clamp(dir.length(), Math.abs(a - b) + 1e-3, a + b - 1e-3);
    dir.normalize();
    const along = (a * a + d * d - b * b) / (2 * d);
    const h = Math.sqrt(Math.max(0, a * a - along * along));
    const pd = pole.clone().sub(dir.clone().multiplyScalar(pole.dot(dir))).normalize();
    const elbow = S.clone().addScaledVector(dir, along).addScaledVector(pd, h);
    aim(upper, E, elbow);
    aim(fore, wp(hand), S.clone().addScaledVector(dir, d));
}

// ---------------------------------------------------------------- juggling
const R_BALL = H * 0.034;
const KINDS = {
    eap:   { color: '#8b5cf6', label: 'EAP',   name: 'Early access' },
    event: { color: '#3b82f6', label: 'EVENT', name: 'Event' },
    ta:    { color: '#10b981', label: 'TA',    name: 'TA commitment' },
    gde:   { color: '#f59e0b', label: 'GDE',   name: 'GDE duty' },
};
const ballGeo = new THREE.SphereGeometry(R_BALL, 40, 28);
const pickGeo = new THREE.SphereGeometry(R_BALL * 2.2, 12, 8);   // fat invisible target: they move fast
const pickMat = new THREE.MeshBasicMaterial({ visible: false });

// Label painted twice around the sphere so it reads from the front mid-spin.
function ballTexture(color, label) {
    const c = document.createElement('canvas'); c.width = 512; c.height = 256;
    const g = c.getContext('2d');
    g.fillStyle = color; g.fillRect(0, 0, 512, 256);
    g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(0, 108, 512, 40);
    g.fillStyle = '#fff'; g.font = `700 ${label.length > 3 ? 46 : 64}px Inter, sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    [128, 384].forEach(x => g.fillText(label, x, 130));
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
}

let balls = [];
let selected = null;
function makeBall(color, label, item) {
    const mat = new THREE.MeshStandardMaterial({ map: ballTexture(color, label), metalness: 0, roughness: 0.4,
        envMapIntensity: 0.6, emissive: new THREE.Color(color), emissiveIntensity: 0 });
    const m = new THREE.Mesh(ballGeo, mat);
    const pick = new THREE.Mesh(pickGeo, pickMat);
    m.add(pick);
    m.userData = { item, pick, urgent: item && item.days_left >= 0 && item.days_left <= 1 };
    pick.userData.ball = m;
    m.position.copy(anchor);
    scene.add(m);
    return m;
}
function setBalls(items) {
    deselect();
    balls.forEach(b => { scene.remove(b); b.material.map.dispose(); b.material.dispose(); });
    balls = items.length ? items.map(it => makeBall(KINDS[it.kind].color, KINDS[it.kind].label, it))
                         : ['#4285F4', '#DB4437', '#F4B400'].map(c => makeBall(c, '', null));
}

// N-ball cascade. Each ball spends DWELL of every half-cycle resting in a
// palm, then flies to the other hand. Each hand catches N balls per cycle,
// so its carry phase is CARRY = DWELL * N / 2 of its own rhythm. That keeps
// the two clocks in lockstep: a ball is always sitting in the hand that holds
// it. DWELL shrinks as N grows so a hand never holds two balls at once.
const MODES = {
    idle:      { period: 2.7, peak: 0.27, hold: 0 },
    talking:   { period: 2.4, peak: 0.25, hold: 0 },
    thinking:  { period: 1.5, peak: 0.42, hold: 0 },
    listening: { period: 2.7, peak: 0.2,  hold: 1 },
    bow:       { period: 2.7, peak: 0.2,  hold: 1 },
};
const J = { phase: 0, period: 2.7, peak: 0.27, hold: 0 };
let anchor = new THREE.Vector3();

function palmPath(sign, p, CARRY) {
    const out = sign * H * 0.115, inn = sign * H * 0.04;
    const catchP = anchor.clone().addScaledVector(SIDE, out).addScaledVector(UP, H * 0.015);
    const throwP = anchor.clone().addScaledVector(SIDE, inn).addScaledVector(UP, H * 0.02);
    if (p < CARRY) {
        const s = p / CARRY;
        return catchP.lerp(throwP, s).addScaledVector(UP, -Math.sin(Math.PI * s) * H * 0.045);
    }
    const s = (p - CARRY) / (1 - CARRY);
    return throwP.lerp(catchP, s).addScaledVector(UP, Math.sin(Math.PI * s) * H * 0.02);
}
const holdSpot = sign => anchor.clone().addScaledVector(SIDE, sign * H * 0.085).addScaledVector(UP, H * 0.01);
const frac = x => x - Math.floor(x);

// ---------------------------------------------------------------- state
const stateEl = document.getElementById('state');
let mode = 'idle', bowT = -1, talkAmp = 0, fakeTalk = false;
function setMode(m) {
    if (mode === 'bow' && bowT >= 0 && m !== 'listening') return;
    mode = m;
    stateEl.dataset.s = m;
    stateEl.textContent = { idle: 'idle', listening: 'listening', thinking: 'thinking', talking: 'speaking', bow: 'bowing' }[m];
}
function bow() { bowT = 0; setMode('bow'); }

const pointer = new THREE.Vector2();
addEventListener('pointermove', e => pointer.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1));

// Smoothed weights so every state change eases instead of snapping.
const W8 = { listen: 0, think: 0, talk: 0, bow: 0 };
const ease = (cur, target, dt, rate) => cur + (target - cur) * (1 - Math.exp(-dt * rate));

const clock = new THREE.Clock();
let t = 0;
function step(dt) {
    t += dt;
    if (ready) {
        rest.forEach((q, b) => b.quaternion.copy(q));
        if (mixer) mixer.update(dt);
        model.updateMatrixWorld(true);

        const M = MODES[mode];
        J.period = ease(J.period, M.period, dt, 3);
        J.peak = ease(J.peak, M.peak, dt, 3);
        J.hold = ease(J.hold, M.hold, dt, 6);
        const juggled = balls.filter(b => b !== selected);
        const N = Math.max(1, juggled.length);
        const DWELL = Math.min(0.3, 1.4 / N), CARRY = DWELL * N / 2;
        // More balls = longer cycle and higher throws, so the hands keep a human tempo.
        J.phase += dt / (J.period * N / 3);

        W8.listen = ease(W8.listen, mode === 'listening' ? 1 : 0, dt, 5);
        W8.think = ease(W8.think, mode === 'thinking' ? 1 : 0, dt, 4);
        W8.talk = ease(W8.talk, mode === 'talking' ? 1 : 0, dt, 5);
        if (bowT >= 0) {
            bowT += dt;
            if (bowT > 2.2) { bowT = -1; setMode('idle'); }
        }
        const bowW = bowT >= 0 ? Math.sin(Math.min(bowT / 2.2, 1) * Math.PI) : 0;

        // Amplitude from her real voice when we have it; a chattery wobble
        // for the browser voice, which can't be metered.
        let amp = 0;
        if (analyser && currentAudio && !currentAudio.paused) {
            analyser.getByteTimeDomainData(ampBuf);
            let sum = 0;
            for (let i = 0; i < ampBuf.length; i++) { const v = (ampBuf[i] - 128) / 128; sum += v * v; }
            amp = Math.min(1, Math.sqrt(sum / ampBuf.length) * 4);
        } else if (fakeTalk) {
            amp = 0.35 + 0.3 * Math.abs(Math.sin(t * 11) * Math.sin(t * 4.3));
        }
        talkAmp = ease(talkAmp, amp, dt, 18);

        // Torso: breathe, lean in to listen, sway while talking, bow.
        turn(B.spine1, SIDE, Math.sin(t * 1.7) * 0.015 + W8.listen * 0.09 + bowW * 0.55);
        turn(B.spine2, FWD, Math.sin(t * 2.1) * 0.035 * W8.talk + Math.sin(t * 0.9) * 0.05 * W8.think);

        // Arms. Anchor = in front of his belly, measured off his actual shoulders.
        const sh = wp(B.upperL).add(wp(B.upperR)).multiplyScalar(0.5);
        anchor = sh.addScaledVector(UP, -H * 0.19).addScaledVector(FWD, H * 0.11);
        const pL = frac(J.phase * N), pR = frac(J.phase * N + N / 2);
        const tgt = {
            L: palmPath(1, pL, CARRY).lerp(holdSpot(1), J.hold),
            R: palmPath(-1, pR, CARRY).lerp(holdSpot(-1), J.hold),
        };
        const palm = {};
        for (const [k, sign] of [['L', 1], ['R', -1]]) {
            // IK drives the wrist; the palm sits a bit past it toward the fingers.
            const palmOff = wp(B['finger' + k]).sub(wp(B['hand' + k])).multiplyScalar(0.5);
            const pole = new THREE.Vector3().addScaledVector(UP, -1).addScaledVector(SIDE, sign * 0.7).addScaledVector(FWD, -0.4);
            reach(B['upper' + k], B['fore' + k], B['hand' + k], tgt[k].clone().sub(palmOff), pole);
            // Fingers point forward and a little up, like a cupped hand.
            aim(B['hand' + k], wp(B['finger' + k]), wp(B['hand' + k]).addScaledVector(FWD, 1).addScaledVector(UP, 0.35).addScaledVector(SIDE, -sign * 0.3));
            // Then roll the forearm until the palm faces up. Palm normal comes
            // from the finger and thumb directions, so no bone axes are assumed.
            const hp = wp(B['hand' + k]);
            const fingerDir = wp(B['finger' + k]).sub(hp).normalize();
            const thumbDir = wp(B['thumb' + k]).sub(hp).normalize();
            const normal = new THREE.Vector3().crossVectors(fingerDir, thumbDir).multiplyScalar(sign).normalize();
            const want = UP.clone().sub(fingerDir.clone().multiplyScalar(UP.dot(fingerDir))).normalize();
            const have = normal.sub(fingerDir.clone().multiplyScalar(normal.dot(fingerDir))).normalize();
            const roll = Math.atan2(new THREE.Vector3().crossVectors(have, want).dot(fingerDir), have.dot(want));
            turn(B['fore' + k], wp(B['hand' + k]).sub(wp(B['fore' + k])).normalize(), roll * 0.6);
            turn(B['hand' + k], fingerDir, roll * 0.4);
            palm[k] = wp(B['hand' + k]).lerp(wp(B['finger' + k]), 0.5).addScaledVector(UP, R_BALL * 0.9);
        }

        // Head: follow the pointer, look up to think, nod with his voice.
        const look = 1 - bowW;
        turn(B.neck, UP, THREE.MathUtils.clamp(pointer.x, -1, 1) * 0.25 * look);
        turn(B.neck, SIDE, -THREE.MathUtils.clamp(pointer.y, -1, 1) * 0.12 * look);
        turn(B.head, FWD, W8.listen * 0.16 + W8.think * 0.1);
        turn(B.head, SIDE, talkAmp * 0.22 + Math.sin(t * 8) * talkAmp * 0.08 - W8.think * 0.22 + bowW * 0.25);

        // Balls
        const peakH = Math.min(J.peak * Math.pow(N / 3, 0.7), 0.4) * H;
        juggled.forEach((ball, i) => {
            const phi = frac(J.phase + i / N);
            const firstHalf = phi < 0.5;
            const u = (phi % 0.5) * 2;
            const src = firstHalf ? 'L' : 'R', dst = firstHalf ? 'R' : 'L';
            let pos;
            if (u < DWELL) {
                pos = palm[src].clone();
            } else {
                const s = (u - DWELL) / (1 - DWELL);
                const a = palmPath(src === 'L' ? 1 : -1, CARRY, CARRY).addScaledVector(UP, R_BALL * 0.9);
                const b = palmPath(dst === 'L' ? 1 : -1, 0, CARRY).addScaledVector(UP, R_BALL * 0.9);
                pos = a.lerp(b, s).addScaledVector(UP, 4 * peakH * s * (1 - s));
                ball.rotation.x += dt * 6; ball.rotation.y += dt * 4;
            }
            // Held: split between her palms, piled up in pairs.
            const side = i % 2 ? 'R' : 'L', k = Math.floor(i / 2);
            const hold = palm[side].clone()
                .addScaledVector(SIDE, ((k % 2) ? 1 : -1) * (k ? R_BALL * 1.05 : 0))
                .addScaledVector(UP, Math.floor(k / 2) * R_BALL * 1.8);
            pos.lerp(hold, J.hold);
            ball.position.lerp(pos, 1 - Math.exp(-dt * 45));
            ball.scale.setScalar(ease(ball.scale.x, ball === hovered ? 1.35 : 1, dt, 10));
        });
        balls.forEach(ball => {
            ball.material.emissiveIntensity = ball.userData.urgent ? 0.18 + 0.18 * Math.sin(t * 5) : 0;
        });
        if (selected) {
            // Presented in front of her, big and slowly turning, like an item pickup.
            const show = anchor.clone().addScaledVector(SIDE, H * 0.2).addScaledVector(FWD, H * 0.14).addScaledVector(UP, H * 0.1);
            selected.position.lerp(show, 1 - Math.exp(-dt * 7));
            selected.scale.setScalar(ease(selected.scale.x, 2.8, dt, 7));
            selected.rotation.y += dt * 0.8;
            selected.rotation.x = ease(selected.rotation.x, 0, dt, 4);
        }
    }
}

function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);   // delta first: getElapsedTime() would zero it
    if (DEBUG && DEBUG.at) {
        // Screenshot checks: fast-forward at a fixed 60fps to an exact moment.
        if (ready) while (t < DEBUG.at) step(1 / 60);
    } else {
        step(dt);
    }
    controls.update();
    renderer.render(scene, camera);
}
// ?mode=thinking&at=4 freezes a pose for screenshot checks.
const params = new URLSearchParams(location.search);
const DEBUG = params.has('at') ? { at: +params.get('at') } : null;
const forced = params.get('mode');
if (forced) setTimeout(() => forced === 'bow' ? bow() : setMode(forced), 0);
animate();


// ---------------------------------------------------------------- voice out
let actx = null, analyser = null, ampBuf = null, currentAudio = null;
function unlockAudio() {
    if (actx) { actx.resume(); return; }
    try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = actx.createAnalyser();
        analyser.fftSize = 512;
        ampBuf = new Uint8Array(analyser.fftSize);
        analyser.connect(actx.destination);
    } catch (e) { console.warn('No WebAudio', e); }
    speechSynthesis.getVoices();
}

function stopSpeaking() {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    speechSynthesis.cancel();
    fakeTalk = false;
    if (mode === 'talking') setMode('idle');
}

function speak(text, audioB64) {
    stopSpeaking();
    if (!text) return;
    setMode('talking');
    const done = () => { fakeTalk = false; currentAudio = null; if (mode === 'talking') setMode('idle'); };
    if (audioB64) {
        const a = new Audio(`data:audio/mpeg;base64,${audioB64}`);
        if (actx) actx.createMediaElementSource(a).connect(analyser);
        a.onended = done;
        currentAudio = a;
        a.play().catch(e => { log('Audio blocked: ' + e.message, 'error'); done(); });
        return;
    }
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.08; u.pitch = 1.3;
    const voices = speechSynthesis.getVoices();
    const v = voices.find(v => /Samantha|Zoe|Ava|Allison|Google US English|Female/.test(v.name));
    if (v) u.voice = v;
    u.onstart = () => { fakeTalk = true; };
    u.onend = u.onerror = done;
    speechSynthesis.speak(u);
}

// ---------------------------------------------------------------- UI
const chat = document.getElementById('chat');
const textEl = document.getElementById('text');
const sendBtn = document.getElementById('send');
const micBtn = document.getElementById('mic');
const logEl = document.getElementById('log');
const vision = document.getElementById('vision');
const visionImg = vision.querySelector('img');
const history = [];
let busy = false;

function log(text, kind = '') {
    const d = document.createElement('div');
    d.className = 'log-entry ' + kind;
    d.textContent = text;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
}
document.getElementById('log-toggle').onclick = () => logEl.classList.toggle('open');

function addMsg(role, text, cls = '') {
    const d = document.createElement('div');
    d.className = `msg ${role} ${cls}`;
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
}

function setBusy(b) {
    busy = b;
    micBtn.disabled = b;
    sendBtn.disabled = b || !textEl.value.trim();
    textEl.placeholder = b ? 'She is thinking...' : 'Ask a follow-up, or tap the mic';
}

function fmtWhen(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
}

const dueLabel = d => d < 0 ? '' : d === 0 ? 'today' : d === 1 ? 'tomorrow' : d + 'd';

function renderJuggle(items) {
    const el = document.getElementById('juggle');
    el.innerHTML = '';
    items.forEach((it, i) => {
        const c = document.createElement('button');
        c.className = 'chip' + (it.days_left >= 0 && it.days_left <= 1 ? ' hot' : it.days_left >= 0 && it.days_left <= 3 ? ' warm' : '');
        c.dataset.i = i;
        const dot = document.createElement('i'); dot.style.background = KINDS[it.kind].color;
        const due = document.createElement('b'); due.textContent = dueLabel(it.days_left);
        const t = document.createElement('span'); t.className = 't'; t.textContent = it.title;
        c.append(dot, due, t);
        c.title = `${KINDS[it.kind].name}: ${it.title}`;
        c.onclick = () => select(balls[i]);
        el.appendChild(c);
    });
}

const detail = document.getElementById('detail');
function select(ball) {
    if (!ball || !ball.userData.item) return;
    if (selected === ball) return deselect();
    selected = ball;
    const it = ball.userData.item, k = KINDS[it.kind];
    detail.querySelector('.kind').textContent = k.name;
    detail.querySelector('.kind').style.color = k.color;
    detail.querySelector('h2').textContent = it.title;
    const when = detail.querySelector('.when');
    when.innerHTML = '';
    if (it.when) {
        const b = document.createElement('b'); b.textContent = fmtDate(it.when);
        when.append(b, it.days_left >= 0 ? ` · ${dueLabel(it.days_left)}` : '');
    }
    detail.querySelector('.summary').textContent = it.summary;
    detail.querySelector('.source').textContent = it.source;
    const links = detail.querySelector('.links');
    links.innerHTML = '';
    it.links.forEach(u => { const a = document.createElement('a'); a.href = u; a.target = '_blank'; a.rel = 'noopener'; a.textContent = u; links.appendChild(a); });
    const acts = detail.querySelector('.actions');
    acts.innerHTML = '';
    renderActions(acts, it.actions);
    detail.hidden = false;
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('sel', balls[+c.dataset.i] === ball));
}
function deselect() {
    selected = null;
    detail.hidden = true;
    document.querySelectorAll('.chip.sel').forEach(c => c.classList.remove('sel'));
}
detail.querySelector('.close').onclick = deselect;
addEventListener('keydown', e => { if (e.key === 'Escape') deselect(); });
detail.querySelector('.ask').onclick = () => {
    const it = selected && selected.userData.item;
    if (!it) return;
    unlockAudio();
    converse({ message: `Tell me about "${it.title}"${it.when ? ' on ' + fmtDate(it.when) : ''}. What do I need to do?` });
};

function fmtDate(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const dateOnly = /^\d{4}-\d{2}-\d{2}$/.test(iso);
    return dateOnly ? new Date(iso + 'T12:00').toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })
                    : d.toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

// ---- picking balls in the scene
const raycaster = new THREE.Raycaster();
const tip = document.getElementById('tip');
let hovered = null, downAt = null;
function ballAt(e) {
    const r = renderer.domElement.getBoundingClientRect();
    raycaster.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
    const hit = raycaster.intersectObjects(balls.map(b => b.userData.pick))[0];
    return hit ? hit.object.userData.ball : null;
}
renderer.domElement.addEventListener('pointermove', e => {
    const b = ballAt(e);
    hovered = b && b.userData.item ? b : null;
    renderer.domElement.style.cursor = hovered ? 'pointer' : '';
    if (hovered) {
        tip.textContent = hovered.userData.item.title;
        tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px';
        tip.style.display = 'block';
    } else tip.style.display = 'none';
});
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
    // A drag rotates the camera. Only a real tap picks.
    if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
    const b = ballAt(e);
    if (b) select(b); else if (selected) deselect();
});

// ---- the silent sweep. Fills the balls; she says nothing until asked.
const boardStatus = document.getElementById('board-status');
async function loadBoard(fresh = true) {
    boardStatus.textContent = 'Sorting your GDE work...';
    try {
        const r = await (await fetch('/board', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fresh }) })).json();
        (r.logs || []).forEach(l => log(l, /fail|expired/i.test(l) ? 'error' : ''));
        if (r.login === 'expired') {
            addMsg('jester', "Uh oh, boss. My key to your inbox expired, so I'm juggling blind. Run mint_user_token.py on the Mac to sign me back in.", 'error');
        }
        // Soonest first, undated last. The model's own ordering drifts.
        const due = it => it.days_left < 0 ? 1e9 : it.days_left;
        const items = (r.items || []).filter(it => KINDS[it.kind]).sort((a, b) => due(a) - due(b));
        setBalls(items);
        renderJuggle(items);
        boardStatus.textContent = items.length ? `${items.length} things in the air · tap one` : 'Nothing GDE in the air right now';
    } catch (e) {
        boardStatus.textContent = '';
        log('Board failed: ' + e.message, 'error');
    }
}

function renderActions(msgEl, actions) {
    if (!actions || !actions.length) return;
    const row = document.createElement('div');
    row.className = 'actions';
    actions.forEach(a => {
        const btn = document.createElement('button');
        btn.className = 'act';
        btn.textContent = a.kind === 'prep_block' ? `${a.label} · ${fmtWhen(a.start)} · ${a.minutes}m` : a.label;
        btn.title = a.kind === 'prep_block' ? a.title : a.url;
        btn.onclick = async () => {
            unlockAudio();
            if (a.kind === 'open_link') { window.open(a.url, '_blank', 'noopener'); return; }
            btn.disabled = true;
            btn.textContent = 'Working...';
            try {
                const r = await (await fetch('/act', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(a) })).json();
                if (r.ok) {
                    const link = document.createElement('a');
                    link.className = 'act done';
                    link.href = r.link; link.target = '_blank'; link.rel = 'noopener';
                    link.textContent = (a.kind === 'prep_block' ? 'Booked' : 'Copied') + ' · open';
                    btn.replaceWith(link);
                    log(`${a.kind}: ${r.link}`, 'ok');
                    bow();
                    setTimeout(() => loadBoard(true), 2500);
                    history.push({ role: 'jester', text: `(Done: ${a.label}${a.start ? ' at ' + a.start : ''}) ${r.say}` });
                } else {
                    btn.disabled = false;
                    btn.classList.add('fail');
                    btn.textContent = 'Failed · retry';
                    log(r.error, 'error');
                }
                speak(r.say, r.audio);
            } catch (e) {
                btn.disabled = false;
                btn.textContent = 'Failed · retry';
                log('Action failed: ' + e.message, 'error');
            }
        };
        row.appendChild(btn);
    });
    msgEl.appendChild(row);
}

let paintSeq = 0;
async function paint(prompt) {
    const my = ++paintSeq;
    vision.classList.add('on', 'painting');
    vision.querySelector('figcaption').textContent = prompt;
    log('Spicy-Mayo painting: ' + prompt);
    try {
        const p = await (await fetch('/paint', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) })).json();
        if (my !== paintSeq) return;
        log(p.log, p.image ? 'ok' : 'error');
        if (p.image) {
            visionImg.classList.remove('ready');
            visionImg.onload = () => visionImg.classList.add('ready');
            visionImg.src = p.image;
        }
    } catch (e) {
        log('Paint failed: ' + e.message, 'error');
    } finally {
        if (my === paintSeq) vision.classList.remove('painting');
    }
}

async function converse({ message = '', audio = null, audio_mime = '' } = {}) {
    if (busy) return;
    setBusy(true);
    stopSpeaking();
    setMode('thinking');
    const userMsg = audio ? addMsg('user', 'Listening to what you said...', 'pending')
                          : message ? addMsg('user', message) : null;
    try {
        const r = await fetch('/converse', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ history, message, audio, audio_mime }),
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        (data.logs || []).forEach(l => log(l, /fail|unavailable|expired/i.test(l) ? 'error' : ''));
        if (userMsg) { userMsg.textContent = data.heard || message || '(inaudible)'; userMsg.classList.remove('pending'); }
        history.push({ role: 'user', text: data.heard || message || 'Sweep my inbox and calendar.' });
        history.push({ role: 'jester', text: data.say });
        document.getElementById('suggest').hidden = true;
        const m = addMsg('jester', data.say);
        renderActions(m, data.actions);
        if (data.paint && data.visual) paint(data.visual);
        setMode('idle');
        speak(data.say, data.audio);
    } catch (e) {
        if (userMsg) userMsg.classList.remove('pending');
        addMsg('jester', 'Oof, I tripped over my own shoes. Try again?', 'error');
        log('Converse failed: ' + e.message, 'error');
        setMode('idle');
    } finally {
        setBusy(false);
    }
}

// ---- text
textEl.addEventListener('input', () => { sendBtn.disabled = busy || !textEl.value.trim(); });
function sendText() {
    const m = textEl.value.trim();
    if (!m || busy) return;
    textEl.value = '';
    sendBtn.disabled = true;
    unlockAudio();
    converse({ message: m });
}
sendBtn.onclick = sendText;
textEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });
document.querySelectorAll('#suggest button').forEach(b => b.onclick = () => { unlockAudio(); converse({ message: b.textContent }); });

// ---- mic. One tap starts, one tap sends. The stream is opened on the first
// tap (not page load), so permission and recording happen in the same press.
let stream = null, rec = null, chunks = [], recording = false, recTimer = null, micMeter = null;

async function startRec() {
    if (recording || busy) return;
    unlockAudio();
    stopSpeaking();
    try {
        if (!stream) stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    } catch (e) {
        addMsg('jester', 'I can\'t hear ya, boss! Allow the microphone for this page, or just type.', 'error');
        log('Mic blocked: ' + e.message, 'error');
        return;
    }
    const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(m => MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
    chunks = [];
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = async () => {
        const blob = new Blob(chunks, { type: rec.mimeType });
        if (blob.size < 1500) { setMode('idle'); return; }
        const b64 = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result.split(',')[1]); fr.readAsDataURL(blob); });
        converse({ audio: b64, audio_mime: rec.mimeType });
    };
    rec.start();
    recording = true;
    micBtn.classList.add('rec');
    micBtn.title = 'Tap to send';
    setMode('listening');
    recTimer = setTimeout(stopRec, 30000);
    if (actx && !micMeter) {
        micMeter = actx.createAnalyser();
        micMeter.fftSize = 256;
        actx.createMediaStreamSource(stream).connect(micMeter);
    }
    const buf = new Uint8Array(256);
    (function meter() {
        if (!recording) { micBtn.style.setProperty('--lvl', 1); return; }
        if (micMeter) {
            micMeter.getByteTimeDomainData(buf);
            let peak = 0;
            for (const v of buf) peak = Math.max(peak, Math.abs(v - 128));
            micBtn.style.setProperty('--lvl', 1 + peak / 128 * 0.6);
        }
        requestAnimationFrame(meter);
    })();
}

function stopRec() {
    if (!recording) return;
    clearTimeout(recTimer);
    recording = false;
    micBtn.classList.remove('rec');
    micBtn.title = 'Tap to talk, tap again to send';
    rec.stop();
}

micBtn.addEventListener('click', () => recording ? stopRec() : startRec());

// Hold Space to talk, like push-to-talk in a game.
let spaceHeld = false;
addEventListener('keydown', e => {
    if (e.code !== 'Space' || e.repeat || document.activeElement === textEl) return;
    e.preventDefault();
    spaceHeld = true;
    startRec().then(() => { if (!spaceHeld) stopRec(); });
});
addEventListener('keyup', e => {
    if (e.code !== 'Space' || document.activeElement === textEl) return;
    spaceHeld = false;
    stopRec();
});

// ---- vision lightbox
const lightbox = document.getElementById('lightbox');
vision.onclick = () => { if (visionImg.src) { lightbox.querySelector('img').src = visionImg.src; lightbox.classList.add('open'); } };
lightbox.onclick = () => lightbox.classList.remove('open');

// Browsers only allow sound after a gesture, and she only talks when asked,
// so any tap is a fine moment to unlock audio.
addEventListener('pointerdown', unlockAudio);
addEventListener('keydown', unlockAudio);
setBalls([]);
loadBoard();
</script>
</body>
